#config-version=FG100F-7.4.13-FW-build2933-260929:opmode=0:vdom=1:user=presta
#conf_file_ver=1
#buildno=2933
#global_vdom=0:vd_name=CLIENT/CLIENT
config system interface
    edit "ssl.CLIENT"
        set vdom "CLIENT"
        set type tunnel
    next
    edit "745"
        set vdom "CLIENT"
        set mode pppoe
        set allowaccess ping https ssh snmp http
        set alias "vlan745 - INET"
        set role wan
        set interface "x1"
        set vlanid 745
    next
    edit "746"
        set vdom "CLIENT"
        set mode pppoe
        set distance 20
        set allowaccess ping https snmp http
        set alias "vlan746 - operateur"
        set role wan
        set interface "x1"
        set vlanid 746
    next
    edit "PARTENAIRE"
        set vdom "CLIENT"
        set type tunnel
        set interface "745"
    next
    edit "2124"
        set vdom "CLIENT"
        set ip 10.244.15.254 255.255.255.0
        set role lan
        set interface "x2"
        set vlanid 2124
    next
end
config system admin
    edit "presta"
        set trusthost1 198.51.100.0 255.255.255.240
        set accprofile "prof_admin"
        set vdom "CLIENT"
    next
end
config firewall address
    edit "France"
        set type geography
        set country "FR"
    next
    edit "IP_PRESTA"
        set subnet 198.51.100.0 255.255.255.240
    next
    edit "RFC1918-10"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "LAN-SITES"
        set subnet 192.168.80.0 255.255.252.0
    next
    edit "LAN-DC"
        set subnet 10.244.15.0 255.255.255.0
    next
    edit "NET-PARTENAIRE"
        set subnet 10.141.141.0 255.255.255.0
    next
end
config firewall addrgrp
    edit "GRP-MGMT"
        set member "France" "IP_PRESTA" "RFC1918-10"
    next
end
config firewall service custom
    edit "SNMP"
        set tcp-portrange 161
    next
    edit "WAN-MGMT"
        set tcp-portrange 1301 22
    next
    edit "CAM-8000"
        set tcp-portrange 80 8000
    next
    edit "HTTPS-MGMT-1301"
        set tcp-portrange 1301
    next
end
config vpn ssl settings
    set ssl-min-proto-ver tls1-1
    set source-interface "745"
    set source-address "France"
end
config vpn ipsec phase1-interface
    edit "PARTENAIRE"
        set interface "745"
        set ike-version 2
        set proposal aes256-sha256
        set dhgrp 14
        set remote-gw 203.0.113.50
    next
end
config log setting
    set fwpolicy-implicit-log enable
end
config firewall vip
    edit "VIP-CAMERA-8000"
        set extip 203.0.113.10
        set mappedip "192.168.80.14"
        set extintf "745"
        set portforward enable
        set extport 8000
        set mappedport 8000
    next
end
config firewall policy
    edit 4
        set name "WAN_TO_CAMERA"
        set srcintf "745"
        set dstintf "746"
        set action accept
        set srcaddr "France"
        set dstaddr "VIP-CAMERA-8000"
        set schedule "always"
        set service "CAM-8000"
    next
    edit 1
        set srcintf "746"
        set dstintf "2124"
        set action accept
        set srcaddr "LAN-SITES"
        set dstaddr "LAN-DC"
        set schedule "always"
        set service "ALL"
    next
    edit 2
        set srcintf "746"
        set dstintf "745"
        set action accept
        set srcaddr "LAN-SITES"
        set dstaddr "all"
        set schedule "always"
        set service "HTTPS"
    next
    edit 3
        set srcintf "746"
        set dstintf "PARTENAIRE"
        set action accept
        set srcaddr "LAN-SITES"
        set dstaddr "NET-PARTENAIRE"
        set schedule "always"
        set service "ALL"
    next
end
config firewall local-in-policy
    edit 1
        set intf "745"
        set srcaddr "GRP-MGMT"
        set srcaddr-negate enable
        set dstaddr "all"
        set service "WAN-MGMT"
        set schedule "always"
    next
    edit 2
        set intf "any"
        set srcaddr "GRP-MGMT"
        set srcaddr-negate enable
        set dstaddr "all"
        set service "HTTPS-MGMT-1301" "SSH" "SNMP"
        set schedule "always"
    next
end
config router static
    edit 1
        set dst 192.168.80.0 255.255.255.0
        set device "746"
        set dynamic-gateway enable
    next
    edit 2
        set dst 192.168.82.0 255.255.255.0
        set device "746"
        set dynamic-gateway enable
    next
    edit 3
        set dst 10.141.141.0 255.255.255.0
        set device "PARTENAIRE"
    next
end
