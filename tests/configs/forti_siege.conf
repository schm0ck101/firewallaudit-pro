#config-version=FGT60F-7.0.12-FW-build0523-230606:opmode=0:vdom=0:user=admin
#conf_file_ver=12345
#buildno=0523
#global_vdom=1
config system global
    set admin-sport 443
    set admin-ssh-port 22
    set admintimeout 480
    set hostname "FGT-SIEGE"
    set timezone 28
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.2 255.255.255.248
        set allowaccess ping https ssh http
        set type physical
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 192.168.1.254 255.255.255.0
        set allowaccess ping https ssh http telnet
        set type hard-switch
        set role lan
    next
    edit "dmz"
        set vdom "root"
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping
        set role dmz
    next
    edit "VLAN_CAMERAS"
        set vdom "root"
        set ip 192.168.50.1 255.255.255.0
        set allowaccess ping
        set interface "internal"
        set vlanid 50
        set role lan
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2xxxx
    next
    edit "presta"
        set accprofile "super_admin"
        set trusthost1 198.51.100.0 255.255.255.0
        set two-factor fortitoken
        set password ENC SH2yyyy
    next
end
config system snmp community
    edit 1
        set name "public"
    next
end
config system ntp
    set ntpsync enable
end
config firewall address
    edit "all"
    next
    edit "LAN_192.168.1.0"
        set subnet 192.168.1.0 255.255.255.0
    next
    edit "SRV-RDS"
        set subnet 192.168.1.10 255.255.255.255
    next
    edit "SRV-WEB"
        set subnet 10.10.10.20 255.255.255.255
    next
    edit "CAMERAS"
        set subnet 192.168.50.0 255.255.255.0
    next
    edit "PRESTA_IP"
        set subnet 198.51.100.7 255.255.255.255
    next
    edit "OBJET_ORPHELIN"
        set subnet 172.16.99.0 255.255.255.0
    next
    edit "www.exemple.fr"
        set type fqdn
        set fqdn "www.exemple.fr"
    next
end
config firewall addrgrp
    edit "SERVEURS"
        set member "SRV-RDS" "SRV-WEB"
    next
end
config firewall service custom
    edit "HTTP"
        set tcp-portrange 80
    next
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "DNS"
        set tcp-portrange 53
        set udp-portrange 53
    next
    edit "ALL"
        set protocol IP
    next
    edit "RDP"
        set tcp-portrange 3389
    next
    edit "SMB"
        set tcp-portrange 445
    next
    edit "TELNET"
        set tcp-portrange 23
    next
    edit "WEB-ADMIN"
        set tcp-portrange 8080 8443
    next
end
config firewall service group
    edit "Web Access"
        set member "DNS" "HTTP" "HTTPS"
    next
end
config firewall vip
    edit "VIP-RDP"
        set extip 203.0.113.3
        set mappedip "192.168.1.10"
        set extintf "wan1"
        set portforward enable
        set extport 3389
        set mappedport 3389
    next
    edit "VIP-WEB"
        set extip 203.0.113.4
        set mappedip "10.10.10.20"
        set extintf "wan1"
        set portforward enable
        set extport 443
        set mappedport 443
    next
end
config firewall policy
    edit 1
        set name "LAN vers Internet"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 2
        set name "Publication RDP"
        set srcintf "wan1"
        set dstintf "internal"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP-RDP"
        set schedule "always"
        set service "RDP"
        set logtraffic disable
    next
    edit 3
        set name "Publication web"
        set srcintf "wan1"
        set dstintf "dmz"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP-WEB"
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ips-sensor "default"
        set av-profile "default"
        set ssl-ssh-profile "certificate-inspection"
    next
    edit 4
        set name "LAN web (inutile)"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "LAN_192.168.1.0"
        set dstaddr "all"
        set schedule "always"
        set service "Web Access"
        set webfilter-profile "default"
    next
    edit 5
        set name "Cameras tout"
        set srcintf "VLAN_CAMERAS"
        set dstintf "any"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
    edit 6
        set name "Bloquer SMB sortant"
        set srcintf "internal"
        set dstintf "wan1"
        set action deny
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "SMB"
    next
    edit 7
        set name "Ancienne regle"
        set status disable
        set srcintf "internal"
        set dstintf "dmz"
        set action accept
        set srcaddr "all"
        set dstaddr "SRV-WEB"
        set schedule "always"
        set service "ALL"
    next
    edit 8
        set name "Presta"
        set srcintf "wan1"
        set dstintf "internal"
        set action accept
        set srcaddr "PRESTA_IP"
        set dstaddr "SERVEURS"
        set schedule "always"
        set service "RDP" "TELNET"
    next
end
config vpn ipsec phase1-interface
    edit "VPN-AGENCE"
        set interface "wan1"
        set ike-version 1
        set mode aggressive
        set peertype any
        set proposal 3des-md5 aes128-sha1
        set dhgrp 2 5
        set remote-gw 198.51.100.50
        set psksecret ENC xxxx
    next
end
config vpn ssl settings
    set servercert "Fortinet_Factory"
    set tunnel-ip-pools "SSLVPN_TUNNEL_ADDR1"
    set source-interface "wan1"
    set source-address "all"
    set port 10443
end
